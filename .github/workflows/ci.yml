name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go vet, lint & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      # Idempotency middleware (concurrency, takeover, release on 5xx), acquirer dedupe, end to end through the router.
      - run: go test -race -count=2 ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  web:
    name: Panel lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build

  container:
    name: Container (one binary, panel embedded)
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@v7
      - run: docker compose build
      - name: Start and check idempotency through the real container
        run: |
          set -euo pipefail
          docker compose up -d
          for i in $(seq 1 30); do curl -fs http://localhost:8080/healthz && break; sleep 2; done
          curl -fs http://localhost:8080/ | grep -q '<div id="root">'
          body='{"amount":1990,"currency":"BRL","card":"4242 4242 4242 4242","description":"CI"}'
          pay() { curl -s -o /dev/null -w '%{http_code}\n' -X POST http://localhost:8080/v1/payments \
                    -H 'Content-Type: application/json' -H "Idempotency-Key: $1" -d "$2"; }
          # Ten concurrent requests with one key: one execution, one charge.
          for i in $(seq 1 10); do pay double-click "$body" & done; wait
          sleep 1
          curl -fs -D headers.txt -o /dev/null -X POST http://localhost:8080/v1/payments \
            -H 'Content-Type: application/json' -H 'Idempotency-Key: double-click' -d "$body"
          grep -qi '^Idempotent-Replayed: true' headers.txt
          [ "$(pay double-click '{"amount":2990,"currency":"BRL","card":"4242424242424242","description":"CI"}')" = 422 ]
          curl -fs http://localhost:8080/v1/stats | tee stats.json
          [ "$(jq .payments stats.json)" -eq 1 ] && [ "$(jq .acquirerCharges stats.json)" -eq 1 ]
      - if: always()
        run: docker compose logs && docker compose down -v

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The CLI scans the full history; the action builds a "<first>^..HEAD" range that fails on a root commit.
      - name: Scan full git history with gitleaks
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --verbose .
